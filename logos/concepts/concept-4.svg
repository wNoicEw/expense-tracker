<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="40%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <filter id="shadow4" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#10b981" flood-opacity="0.35" />
    </filter>
  </defs>

  <rect width="512" height="512" rx="128" fill="url(#bgGrad4)" stroke="rgba(255, 255, 255, 0.08)" stroke-width="6" />

  <g id="icon" filter="url(#shadow4)">
    <!-- Security & Wealth Shield Contour -->
    <path d="M 256 100 L 372 144 C 372 260 324 352 256 400 C 188 352 140 260 140 144 Z" 
          fill="none" stroke="url(#shieldGrad)" stroke-width="24" stroke-linejoin="round" />

    <!-- Center Precision 'M' Curve & Check -->
    <path d="M 190 270 L 230 310 L 322 200" 
          fill="none" stroke="#34d399" stroke-width="32" stroke-linecap="round" stroke-linejoin="round" />
          
    <circle cx="256" cy="180" r="16" fill="#38bdf8" />
  </g>
</svg>
