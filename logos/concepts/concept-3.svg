<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <linearGradient id="prismGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>

    <linearGradient id="accentCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <filter id="shadow3" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#10b981" flood-opacity="0.3" />
    </filter>
  </defs>

  <rect width="512" height="512" rx="128" fill="url(#bgGrad3)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="6" />

  <g id="icon" filter="url(#shadow3)">
    <!-- Hexagonal Prism Outer Frame -->
    <path d="M 256 80 L 396 160 L 396 320 L 256 400 L 116 320 L 116 160 Z" 
          fill="none" stroke="rgba(255, 255, 255, 0.08)" stroke-width="12" stroke-linejoin="round" />

    <!-- Ascending Financial Step Bars forming Currency 'M' -->
    <rect x="156" y="270" width="44" height="90" rx="10" fill="#3b82f6" opacity="0.85" />
    <rect x="216" y="210" width="44" height="150" rx="10" fill="url(#accentCyan)" />
    <rect x="276" y="160" width="44" height="200" rx="10" fill="url(#prismGrad)" />
    
    <!-- Top Trending Trendline / Arrow -->
    <path d="M 140 270 L 220 200 L 280 150 L 370 90" 
          fill="none" stroke="#34d399" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 320 90 L 370 90 L 370 140" 
          fill="none" stroke="#34d399" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
