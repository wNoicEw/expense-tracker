<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <linearGradient id="inflowRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <linearGradient id="outflowRing" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>

    <filter id="glow2" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#06b6d4" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Base Squircle -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad2)" stroke="rgba(255, 255, 255, 0.08)" stroke-width="6" />

  <!-- Dual Orbit Group -->
  <g id="icon" filter="url(#glow2)">
    <!-- Primary Upper Inflow Arc -->
    <path d="M 140 256 C 140 160 216 120 286 120 C 362 120 400 176 392 236 C 388 266 364 286 334 286 C 304 286 284 266 284 236 C 284 210 264 190 236 190 C 200 190 190 220 190 256" 
          fill="none" stroke="url(#inflowRing)" stroke-width="36" stroke-linecap="round" />

    <!-- Secondary Lower Outflow Arc -->
    <path d="M 372 256 C 372 352 296 392 226 392 C 150 392 112 336 120 276 C 124 246 148 226 178 226 C 208 226 228 246 228 276 C 228 302 248 322 276 322 C 312 322 322 292 322 256" 
          fill="none" stroke="url(#outflowRing)" stroke-width="36" stroke-linecap="round" />

    <!-- Center Balance Spark -->
    <circle cx="256" cy="256" r="28" fill="#10b981" />
    <circle cx="256" cy="256" r="14" fill="#ffffff" />
  </g>
</svg>
