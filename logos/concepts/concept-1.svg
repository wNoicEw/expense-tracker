<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Primary Emerald-Cyan Glow Gradient -->
    <linearGradient id="glowGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <!-- Accent Green Gradient -->
    <linearGradient id="accentGrad1" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>

    <!-- Subtle Drop Shadow Filter -->
    <filter id="shadow1" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#10b981" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Base Rounded Squircle -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad1)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="6" />

  <!-- Logo Mark: Geometric 'M' Vault & Upward Growth Arrow -->
  <g id="icon" filter="url(#shadow1)">
    <!-- Left Pillar of M -->
    <path d="M 128 356 L 128 176 C 128 162.7 138.7 152 152 152 L 180 152 C 193.3 152 204 162.7 204 176 L 204 356 C 204 369.3 193.3 380 180 380 L 152 380 C 138.7 380 128 369.3 128 356 Z" 
          fill="url(#accentGrad1)" />

    <!-- Right Pillar of M / Upward Trajectory -->
    <path d="M 308 356 L 308 176 C 308 162.7 318.7 152 332 152 L 360 152 C 373.3 152 384 162.7 384 176 L 384 356 C 384 369.3 373.3 380 360 380 L 332 380 C 318.7 380 308 369.3 308 356 Z" 
          fill="url(#glowGrad1)" />

    <!-- Central Dynamic Vertex & Ascending Arrow Peak -->
    <path d="M 196 168 L 256 244 L 316 168 C 324.5 157.2 340.5 157.2 349 168 L 349 168 C 358.5 180 355.8 197.8 343 206.5 L 273 294 C 263.6 305.8 248.4 305.8 239 294 L 169 206.5 C 156.2 197.8 153.5 180 163 168 L 163 168 C 171.5 157.2 187.5 157.2 196 168 Z" 
          fill="#38bdf8" />

    <!-- Floating Wealth Node / Spark -->
    <circle cx="256" cy="144" r="22" fill="#34d399" />
  </g>
</svg>
